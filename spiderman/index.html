<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homem-Aranha: Arquivo Oficial</title>
  <meta name="description" content="Registro oficial dos filmes, trajes e vilões da trilogia do Homem-Aranha no Universo Cinematográfico Marvel, em ordem cronológica.">
  <link rel="icon" href="assets/logo/emblema.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="cover" class="cover">
    <img class="cover-emblem" src="assets/logo/emblema.png" alt="Emblema do Homem-Aranha">
    <p class="cover-kicker">Arquivo Oficial</p>
    <h1 class="cover-title">Homem-Aranha</h1>
    <button id="cover-enter" class="cover-enter" type="button" aria-label="Rolar para entrar">
      <span>Role para entrar</span>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M12 4v15M12 19l-6-6M12 19l6-6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div id="site" class="site" aria-hidden="true">

    <header class="site-header">
      <div class="header-inner">
        <a href="#" class="brand">
          <img class="brand-emblem" src="assets/logo/emblema.png" alt="">
          <span class="brand-text">Homem-Aranha<em>Arquivo Oficial</em></span>
        </a>
        <nav class="main-nav">
          <a href="#de-volta-ao-lar">2017</a>
          <a href="#guerra-infinita">2018</a>
          <a href="#longe-de-casa">2019</a>
          <a href="#sem-volta-pra-casa">2021</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="timeline"></div>
    </main>

    <footer class="outro">
      <img class="outro-emblem" src="assets/logo/emblema.png" alt="">
      <p class="outro-text">Fim do arquivo</p>
      <button id="btn-reiniciar" class="outro-btn" type="button">Rever a coleção</button>
    </footer>

  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
