# Publica o jogo de Poker (pasta poker/) no GitHub Pages deste repositório.
# O Pages é servido a partir da branch gh-pages (que também tem o Blackjack e outros sites),
# então este workflow atualiza SOMENTE a pasta gh-pages/poker/ — nada mais é alterado.
# Resultado: https://<usuario>.github.io/<repo>/poker/
name: Deploy Poker no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "poker/**"
      - ".github/workflows/poker-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poker-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: poker/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/poker

      - name: Atualizar gh-pages/poker
        run: |
          DEST="$RUNNER_TEMP/gh-pages"
          git fetch origin gh-pages
          git worktree add "$DEST" origin/gh-pages
          cd "$DEST"
          git checkout -B gh-pages origin/gh-pages
          rm -rf poker
          cp -r "$GITHUB_WORKSPACE/poker/out" poker
          # Sem Jekyll: ele ignoraria a pasta _next do Next.js.
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou no site."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza o Poker Night (${GITHUB_SHA::7})"
          git push origin gh-pages
