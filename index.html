<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOMEM DE FERRO — Arquivo Técnico</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#07070a;
  --bg-panel:#101015;
  --bg-panel-2:#16161d;
  --line:#26262f;
  --stark-red:#c1121f;
  --stark-red-dim:#5c0a10;
  --gold:#f0a500;
  --gold-bright:#ffcb47;
  --cyan:#3ee6df;
  --cyan-dim:#164b49;
  --text:#e9e9ee;
  --text-dim:#8f8f9c;
  --text-faint:#5a5a66;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani', sans-serif;
  font-size:18px;
  line-height:1.5;
  overflow-x:hidden;
}
::selection{background:var(--stark-red); color:#fff;}

h1,h2,h3,.font-display{font-family:'Orbitron', sans-serif;}
.mono{font-family:'JetBrains Mono', monospace;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
}

/* ---------- utility ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:0 32px;}
.eyebrow{
  font-family:'JetBrains Mono', monospace;
  font-size:12px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--gold);
  display:flex; align-items:center; gap:10px;
}
.eyebrow::before{content:""; width:22px; height:1px; background:var(--gold);}
.section{padding:120px 0; position:relative;}
.section-head{max-width:640px; margin-bottom:64px;}
.section-head h2{font-size:clamp(30px,4vw,46px); font-weight:900; letter-spacing:.02em; margin:14px 0 16px; text-transform:uppercase;}
.section-head p{color:var(--text-dim); font-size:19px; font-weight:500;}
.corner-frame{position:relative;}
.corner-frame::before,.corner-frame::after{content:""; position:absolute; width:16px; height:16px; border-color:var(--gold); opacity:.7;}
.corner-frame::before{top:-1px; left:-1px; border-top:2px solid; border-left:2px solid;}
.corner-frame::after{bottom:-1px; right:-1px; border-bottom:2px solid; border-right:2px solid;}

/* ---------- scanline overlay ---------- */
.scan-overlay{
  pointer-events:none; position:fixed; inset:0; z-index:60; opacity:.035;
  background:repeating-linear-gradient(to bottom, #fff 0px, #fff 1px, transparent 1px, transparent 3px);
  mix-blend-mode:overlay;
}

/* ---------- specular / metal helpers ---------- */
.specular-highlight{fill:#ffffff; mix-blend-mode:screen; pointer-events:none;}

/* ---------- nav ---------- */
nav{
  position:fixed; top:0; left:0; right:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:22px 40px;
  backdrop-filter:blur(10px);
  background:rgba(7,7,10,.55);
  border-bottom:1px solid transparent;
  transition:border-color .3s, background .3s;
}
nav.scrolled{border-bottom-color:var(--line); background:rgba(7,7,10,.85);}
.logo{display:flex; align-items:center; gap:10px; font-family:'Orbitron'; font-weight:700; font-size:15px; letter-spacing:.12em; color:var(--text);}
.logo .dot{width:12px; height:12px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #fff, var(--cyan) 40%, var(--cyan-dim)); box-shadow:0 0 10px var(--cyan);} 
.navlinks{display:flex; gap:34px; font-size:14px; letter-spacing:.08em; text-transform:uppercase;}
.navlinks a{color:var(--text-dim); text-decoration:none; font-weight:600; transition:color .2s; position:relative;}
.navlinks a:hover{color:var(--gold-bright);}
@media(max-width:760px){.navlinks{display:none;}}

/* ---------- hero ---------- */
.hero{
  min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative; text-align:center; padding:140px 24px 60px;
  background:
    radial-gradient(ellipse 900px 600px at 50% 18%, rgba(193,18,31,.18), transparent 60%),
    radial-gradient(ellipse 700px 500px at 50% 30%, rgba(62,230,223,.08), transparent 60%),
    var(--bg);
}
.hero::before{ /* subtle grid */
  content:""; position:absolute; inset:0; opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse 700px 500px at 50% 30%, black, transparent 75%);
}
.reactor-wrap{position:relative; width:220px; height:220px; margin-bottom:36px; cursor:pointer;}
.reactor-rings{width:100%; height:100%;}
.reactor-rings .ring{fill:none; stroke:var(--cyan); opacity:.55;}
.reactor-rings .r1{stroke-width:1; stroke-dasharray:2 6; animation:spin 24s linear infinite;}
.reactor-rings .r2{stroke-width:1.4; stroke-dasharray:14 5; animation:spin 16s linear infinite reverse;}
.reactor-rings .r3{stroke-width:.8; opacity:.3; animation:spin 40s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.reactor-core{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
.reactor-core svg{width:64%; height:64%;}
.reactor-core .glow{animation:pulse 2.6s ease-in-out infinite;}
@keyframes pulse{
  0%,100%{filter:drop-shadow(0 0 10px var(--cyan)) drop-shadow(0 0 26px rgba(62,230,223,.5));}
  50%{filter:drop-shadow(0 0 20px var(--cyan)) drop-shadow(0 0 46px rgba(62,230,223,.75));}
}
.hero-title{font-size:clamp(44px,8vw,104px); font-weight:900; letter-spacing:.01em; line-height:.95; text-transform:uppercase;}
.hero-title .accent{color:var(--stark-red); -webkit-text-stroke:1px var(--gold-bright); }
.hero-sub{margin-top:20px; max-width:560px; color:var(--text-dim); font-size:20px; font-weight:500;}
.hero-tag{margin-top:26px; font-family:'JetBrains Mono'; font-size:12.5px; letter-spacing:.25em; color:var(--gold); text-transform:uppercase;}
.scroll-cue{position:absolute; bottom:34px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--text-faint); font-family:'JetBrains Mono'; font-size:11px; letter-spacing:.2em;}
.scroll-cue .bar{width:1px; height:34px; background:linear-gradient(var(--gold), transparent); animation:dropcue 1.8s ease-in-out infinite;}
@keyframes dropcue{0%{opacity:0; transform:translateY(-8px);}50%{opacity:1;}100%{opacity:0; transform:translateY(8px);}}

/* ---------- about / suit-up ---------- */
.about-grid{display:grid; grid-template-columns:1.05fr .95fr; gap:70px; align-items:center;}
@media(max-width:900px){.about-grid{grid-template-columns:1fr;}}
.about-text p{color:var(--text-dim); font-size:18.5px; margin-bottom:18px; font-weight:500;}
.about-text strong{color:var(--text); font-weight:700;}
.stat-row{display:flex; gap:0; margin-top:34px; border-top:1px solid var(--line);}
.stat{flex:1; padding:18px 0; border-right:1px solid var(--line);}
.stat:last-child{border-right:none;}
.stat .num{font-family:'Orbitron'; font-weight:900; font-size:26px; color:var(--gold-bright);}
.stat .lbl{font-family:'JetBrains Mono'; font-size:10.5px; letter-spacing:.14em; color:var(--text-faint); text-transform:uppercase; margin-top:4px;}

.suitup-stage{
  position:relative; aspect-ratio:1/1.15; background:radial-gradient(ellipse at 50% 40%, rgba(193,18,31,.10), transparent 65%), var(--bg-panel);
  border:1px solid var(--line); border-radius:6px; overflow:hidden;
}
.suitup-stage svg{width:100%; height:100%;}
.suit-plate{opacity:0; transform:translateY(-46px) scale(.88) rotate(-4deg); transform-origin:center; animation:none;}
.suitup-stage.armed .suit-plate{animation:plateIn .6s cubic-bezier(.17,.85,.2,1.15) forwards;}
.suitup-stage.armed .p1{animation-delay:.05s;}
.suitup-stage.armed .p2{animation-delay:.15s;}
.suitup-stage.armed .p3{animation-delay:.22s;}
.suitup-stage.armed .p4{animation-delay:.30s;}
.suitup-stage.armed .p5{animation-delay:.38s;}
.suitup-stage.armed .p6{animation-delay:.46s;}
.suitup-stage.armed .p7{animation-delay:.52s;}
.suitup-stage.armed .p8{animation-delay:.58s;}
.suitup-stage.armed .eye-glow{animation:eyeGlow .5s ease .78s forwards;}
@keyframes plateIn{
  0%{opacity:0; transform:translateY(-46px) scale(.88) rotate(-4deg);}
  70%{opacity:1; transform:translateY(2px) scale(1.015) rotate(.6deg);}
  100%{opacity:1; transform:translateY(0) scale(1) rotate(0deg);}
}
@keyframes eyeGlow{0%{opacity:0;}60%{opacity:.4;}80%{opacity:.85;}100%{opacity:1; filter:drop-shadow(0 0 6px var(--cyan)) drop-shadow(0 0 14px var(--cyan));}}
.stage-caption{position:absolute; left:14px; bottom:12px; font-family:'JetBrains Mono'; font-size:11px; color:var(--text-faint); letter-spacing:.1em;}
.stage-btn{position:absolute; top:12px; right:12px; background:transparent; border:1px solid var(--line); color:var(--text-dim); font-family:'JetBrains Mono'; font-size:10.5px; letter-spacing:.12em; padding:7px 12px; cursor:pointer; text-transform:uppercase; transition:all .2s;}
.stage-btn:hover{border-color:var(--gold); color:var(--gold-bright);}

.shine-sweep{opacity:0; transform:translateX(-20px) skewX(-15deg);}
.suitup-stage.armed .shine-sweep{animation:shineSweep 5s ease-in-out 1.1s infinite;}
@keyframes shineSweep{
  0%{transform:translateX(-20px) skewX(-15deg); opacity:0;}
  4%{opacity:.6;}
  11%{opacity:0;}
  100%{transform:translateX(70px) skewX(-15deg); opacity:0;}
}
.thruster-flame{opacity:0; transform-origin:center;}
.suitup-stage.armed .thruster-flame{animation:thrusterPulse 1.15s ease-in-out .95s infinite;}
@keyframes thrusterPulse{0%,100%{opacity:.45; transform:scaleY(.75);}50%{opacity:1; transform:scaleY(1.35);}}
.reactor-pulse-chest{animation:pulse 2.6s ease-in-out infinite;}

/* ---------- armors ---------- */
.armor-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:2px; background:var(--line); border:1px solid var(--line);} (truncated for brevity)
